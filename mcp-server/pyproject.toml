[project]
name = "lumen-mcp"
version = "0.1.0"
description = "MCP server that lets AI tools search your Lumen documents"
readme = "README.md"
authors = [
    { name = "Rodrigo Machado", email = "rodrigomachado@ipvc.pt" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.15.1",
    "mcp>=2.3.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
lumen-mcp = "lumen_mcp:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "ASYNC", "RUF"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
