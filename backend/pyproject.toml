[project]
name = "lumen"
version = "0.1.0"
description = "Lumen API: grounded question answering over your documents"
readme = "README.md"
authors = [
    { name = "Rodrigo Machado", email = "rodrigomachado@ipvc.pt" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.16.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.156.1",
    "langfuse>=5.0.3",
    "markdown-it-py>=4.2.0",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Deprecations coming from our own code should fail the build, not scroll past.
filterwarnings = ["error::DeprecationWarning:lumen.*", "error::DeprecationWarning:tests.*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "RUF",
]
ignore = [
    "SIM905",  # "a b c".split() reads better than long word lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
